<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal of the Day - Real Time</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 40px;
      border-bottom: 2px solid #000;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      transition: all 0.2s;
    }

    button:hover {
      background: #000;
      color: #fff;
    }

    button.active {
      background: #000;
      color: #fff;
    }

    button.secondary {
      background: #e0e0e0;
      border-color: #999;
    }

    button.secondary:hover {
      background: #999;
      color: #fff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 16px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 32px;
      margin-bottom: 24px;
      border-radius: 4px;
    }

    .deal-header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }

    .deal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .deal-meta {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
    }

    .deal-meta a {
      color: #0066cc;
      text-decoration: none;
      word-break: break-all;
    }

    .deal-meta a:hover {
      text-decoration: underline;
    }

    .label {
      display: inline-block;
      background: #f0f0f0;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 2px;
      margin-bottom: 12px;
    }

    .source-link {
      background: #e8f4f8;
      border: 1px solid #b3dfe8;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .source-link strong {
      display: block;
      margin-bottom: 6px;
      color: #0066cc;
    }

    .source-link a {
      color: #0066cc;
      text-decoration: none;
      word-break: break-all;
      display: block;
      margin-top: 4px;
    }

    .source-link a:hover {
      text-decoration: underline;
    }

    .note-section {
      margin-bottom: 24px;
    }

    .note-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #999;
      margin-bottom: 12px;
    }

    .generated-note {
      background: #f9f9f9;
      padding: 20px;
      border-left: 4px solid #000;
      font-size: 15px;
      line-height: 1.8;
      word-break: break-word;
      white-space: pre-wrap;
      font-family: Georgia, serif;
      min-height: 200px;
    }

    .note-stats {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }

    .stat-value {
      font-weight: 700;
      color: #000;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin: 24px 0;
      flex-wrap: wrap;
    }

    .image-suggestion {
      background: #f0f0f0;
      padding: 16px;
      border-radius: 4px;
      margin: 16px 0;
      font-size: 13px;
    }

    .image-suggestion strong {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      font-weight: 700;
    }

    .image-link {
      color: #0066cc;
      text-decoration: none;
      word-break: break-all;
    }

    .image-link:hover {
      text-decoration: underline;
    }

    .disclaimer {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 14px;
      border-radius: 4px;
      font-size: 13px;
      color: #333;
      margin-top: 20px;
    }

    .copy-feedback {
      font-size: 12px;
      color: #22863a;
      margin-top: 8px;
    }

    .no-deals {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .deals-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .deal-option {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .deal-option:hover {
      background: #f5f5f5;
      border-color: #000;
    }

    .deal-option strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .deal-option small {
      display: block;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      .controls { flex-direction: column; }
      button { width: 100%; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Deal of the Day - Real Time</h1>
      <p class="subtitle">Today's VC Deals: Europe & Africa - May 12, 2026</p>
    </header>

    <div class="controls">
      <button onclick="setFilter('all')" id="btn-all" class="active">All Regions</button>
      <button onclick="setFilter('european vc')" id="btn-eu">European VC</button>
      <button onclick="setFilter('african & mena')" id="btn-africa">African & MENA</button>
      <button class="secondary" onclick="fetchDeals()" id="fetch-btn">🔄 Fetch Today's Deals</button>
    </div>

    <div id="content">
      <div class="no-deals">
        <p>👇 Clique "Fetch Today's Deals" pour charger les vraies news du jour</p>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '7ae2e8095d034715b1e7dad7c818175f';
    let allDeals = [];
    let currentDeal = null;
    let currentFilter = 'all';

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${filter.split(' ')[0]}`).classList.add('active');
    }

    function getFilteredDeals() {
      if (currentFilter === 'all') return allDeals;
      return allDeals.filter(d => d.region && d.region.toLowerCase() === currentFilter.toLowerCase());
    }

    async function fetchDeals() {
      const fetchBtn = document.getElementById('fetch-btn');
      fetchBtn.disabled = true;

      document.getElementById('content').innerHTML = `
        <div class="loading">
          <span class="spinner"></span>
          Searching for today's deals (checking last 3 days)...
        </div>
      `;

      try {
        // Last 3 days to catch everything
        const today = new Date();
        const threeDaysAgo = new Date(today.getTime() - 3 * 24 * 60 * 60 * 1000);
        const fromDate = threeDaysAgo.toISOString().split('T')[0];
        const toDate = today.toISOString().split('T')[0];

        // Broader search terms
        const searchTerms = [
          'funding raise',
          'series a funding',
          'series b funding',
          'venture capital',
          'startup investment',
          'seed funding',
          'angel investment'
        ];

        let deals = [];

        for (const term of searchTerms) {
          try {
            const response = await fetch(
              `https://newsapi.org/v2/everything?q=${encodeURIComponent(term)}&from=${fromDate}&to=${toDate}&sortBy=publishedAt&language=en&apiKey=${API_KEY}`
            );
            const data = await response.json();

            if (data.articles && data.articles.length > 0) {
              const parsed = data.articles
                .slice(0, 5) // Only top 5 per search
                .map(article => {
                  const title = article.title || '';
                  const description = article.description || '';
                  const content = article.content || '';
                  const fullText = `${title} ${description} ${content}`.toLowerCase();

                  // Detect region - broader matching
                  let region = 'Other';
                  const euroKeywords = ['europe', 'uk', 'germany', 'france', 'spain', 'italy', 'netherlands', 'belgium', 'sweden', 'denmark', 'poland', 'london', 'paris', 'berlin'];
                  const africaKeywords = ['africa', 'mena', 'nigeria', 'kenya', 'egypt', 'south africa', 'morocco', 'tunisia', 'ghana', 'rwanda'];

                  if (euroKeywords.some(k => fullText.includes(k))) {
                    region = 'European VC';
                  } else if (africaKeywords.some(k => fullText.includes(k))) {
                    region = 'African & MENA';
                  }

                  // Extract company and amount
                  const amountMatch = fullText.match(/\$[\d.]+\s*(m|b|million|billion)?/i);
                  const amount = amountMatch ? amountMatch[0] : 'Undisclosed';

                  return {
                    company: extractCompanyName(title),
                    amount: amount,
                    description: title,
                    date: article.publishedAt.split('T')[0],
                    url: article.url,
                    source: article.source.name,
                    region: region
                  };
                });

              deals = [...deals, ...parsed];
            }
          } catch (e) {
            console.error(`Error fetching ${term}:`, e);
          }
        }

        // Remove duplicates
        allDeals = Array.from(new Map(deals.map(d => [d.company + d.url, d])).values());

        // Filter valid deals (both regions)
        allDeals = allDeals.filter(d => d.region !== 'Other');

        fetchBtn.disabled = false;

        if (allDeals.length > 0) {
          showDealsList();
        } else {
          // Fallback: show message and allow user to add manual deals
          document.getElementById('content').innerHTML = `
            <div class="card">
              <div class="error">
                ⚠️ No VC deals found in the news yet.
                <br><br>
                This can happen if:
                • No deals were published in the last 3 days
                • NewsAPI hasn't indexed them yet
                • Your API key has limits
              </div>
              <p style="margin-top: 20px; font-size: 14px; color: #666;">
                <strong>Workaround:</strong> You can search Twitter/Crunchbase directly for today's deals and I'll help you write the note manually.
              </p>
              <button class="secondary" onclick="location.reload()">Try Again</button>
            </div>
          `;
        }
      } catch (error) {
        fetchBtn.disabled = false;
        document.getElementById('content').innerHTML = `
          <div class="error">
            ❌ Error: ${error.message}
            <br><br>
            <small>Check: API key validity, internet connection, or try a different search approach.</small>
          </div>
        `;
      }
    }

    function extractCompanyName(title) {
      const match = title.match(/^([^\s]+(?:\s+[^\s]+)?)\s/);
      return match ? match[1] : title.substring(0, 30);
    }

    function showDealsList() {
      const filtered = getFilteredDeals();

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="no-deals">
            No deals in this region for today.
          </div>
        `;
        return;
      }

      let html = `
        <div class="card">
          <h2>Found ${filtered.length} deals today</h2>
          <p style="color: #666; margin-bottom: 20px; font-size: 13px;">Click a deal to generate your Substack note</p>
          <div class="deals-list">
      `;

      filtered.forEach((deal, i) => {
        html += `
          <div class="deal-option" onclick="selectDeal(${i})">
            <strong>${deal.company}</strong>
            <small>${deal.amount} • ${deal.region} • ${deal.source}</small>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      document.getElementById('content').innerHTML = html;
    }

    function selectDeal(index) {
      const filtered = getFilteredDeals();
      currentDeal = filtered[index];
      renderDeal();
    }

    function generateNote(deal) {
      const templates = [
        `${deal.company} just raised ${deal.amount}.

${deal.description}.

Why it matters: Fresh conviction in this market. Check who led the round — investor choice signals something.

What consensus gets wrong: Most miss the regulatory or competitive headwinds in this vertical.

Question: Can they maintain growth at half the current CAC burn?

Source: ${deal.source}`,

        `${deal.company} secured ${deal.amount}.

The play: ${deal.description.substring(0, 80)}...

Deeper: The check size and investor mix tell you about stage ambitions and geography bets.

Real question: What's the path to profitability if growth slows?

Watch: Unit economics and cohort retention over the next 12 months.

Source: ${deal.source}`,

        `${deal.company} Series funding: ${deal.amount}.

Core thesis: ${deal.description.substring(0, 80)}...

The data: This signals fresh LP capital into ${deal.region.toLowerCase()}.

Gap in analysis: Most coverage ignores execution risk and market headwinds.

One to ask: What happens if the lead doesn't follow in the next round?

Source: ${deal.source}`
      ];

      let note = templates[Math.floor(Math.random() * templates.length)];

      // Word count limit
      const words = note.split(/\s+/);
      if (words.length > 120) {
        note = words.slice(0, 120).join(' ') + '...';
      }

      // Remove em-dashes
      note = note.replace(/—/g, ', ');

      return note;
    }

    function renderDeal() {
      if (!currentDeal) return;

      const note = generateNote(currentDeal);
      const wordCount = note.split(/\s+/).length;

      const html = `
        <div class="card">
          <div class="deal-header">
            <div class="deal-title">${currentDeal.company}</div>
            <div class="deal-meta">
              💰 ${currentDeal.amount} | 🏢 ${currentDeal.source} | 📅 ${currentDeal.date}
            </div>
          </div>

          <span class="label">${currentDeal.region}</span>

          <div class="source-link">
            <strong>📰 Source Article</strong>
            <a href="${currentDeal.url}" target="_blank">
              ${currentDeal.url}
            </a>
            <small style="color: #666;">👆 Click here to verify the deal before publishing</small>
          </div>

          <div class="note-section">
            <h3>Your Substack Note (${wordCount}/120 words)</h3>
            <div class="generated-note">${note}</div>
            <div class="note-stats">
              <div>Word count: <span class="stat-value">${wordCount}</span> / 120</div>
              <div>Em-dashes: <span class="stat-value">0</span></div>
            </div>
          </div>

          <div class="actions">
            <button onclick="copyNote('${note.replace(/'/g, "\\'")}')">📋 Copy Note</button>
            <button class="secondary" onclick="showDealsList()">🔄 See Other Deals</button>
          </div>

          <div id="feedback"></div>

          <div class="disclaimer">
            ⚠️ <strong>IMPORTANT:</strong> Always verify deal details on the source article before publishing. Confirm amounts, investors, and dates are accurate.
          </div>
        </div>
      `;

      document.getElementById('content').innerHTML = html;
    }

    function copyNote(note) {
      navigator.clipboard.writeText(note).then(() => {
        const feedback = document.getElementById('feedback');
        feedback.innerHTML = '<div class="copy-feedback">✅ Note copied! Paste it in Substack now.</div>';
        setTimeout(() => {
          feedback.innerHTML = '';
        }, 3000);
      }).catch(err => {
        console.error('Copy failed:', err);
        alert('Manual copy: select the text and Ctrl+C');
      });
    }

    // Initialize
    document.getElementById('btn-all').classList.add('active');
  </script>
</body>
</html>
