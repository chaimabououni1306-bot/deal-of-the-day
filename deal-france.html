<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal of the Day - France & Europe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .header {
      background: white;
      padding: 30px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
    }
    h1 { margin: 0; color: #000; }
    .subtitle { color: #666; margin: 5px 0 0 0; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .deals-list {
      display: grid;
      gap: 15px;
    }
    .deal-item {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .deal-item:hover {
      background: #f0f0f0;
      border-color: #000;
    }
    .deal-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
    }
    .deal-meta {
      font-size: 12px;
      color: #666;
      margin: 3px 0;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: #ffe0e0;
      color: #c00;
      padding: 15px;
      border-radius: 3px;
      margin-bottom: 15px;
    }
    .note-display {
      background: white;
      padding: 30px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .deal-header {
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
      margin-bottom: 15px;
    }
    .deal-header h2 { margin: 0 0 5px 0; }
    .deal-header p { margin: 5px 0; color: #666; font-size: 13px; }
    .note-text {
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #000;
      font-family: Georgia, serif;
      white-space: pre-wrap;
      line-height: 1.8;
      margin: 15px 0;
    }
    .word-count {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }
    button {
      background: #000;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px 10px 0;
    }
    button:hover { background: #333; }
    button.back {
      background: #666;
    }
    button.back:hover { background: #999; }
    button.copy {
      background: #0066cc;
    }
    button.copy:hover { background: #0052a3; }
    .success {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
    .region-tag {
      display: inline-block;
      background: #e0e0e0;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 Deal of the Day</h1>
  <p class="subtitle">France & Europe Fundraising News</p>
</div>

<div id="app"></div>

<script>
const API_KEY = '7ae2e8095d034715b1e7dad7c818175f';

function showLoading() {
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align: center; padding: 40px;">
      <div class="spinner"></div>
      <p style="margin-top: 15px;">Loading France & Europe fundraising deals...</p>
    </div>
  `;
}

async function loadDeals() {
  showLoading();

  try {
    const today = new Date();
    const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
    const fromDate = sevenDaysAgo.toISOString().split('T')[0];

    // Search for France and Europe fundraising
    const query = '(France OR Europe) AND (fundraising OR funding OR investment OR startup) AND (million OR series)';

    const response = await fetch(
      `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&from=${fromDate}&sortBy=publishedAt&language=en&pageSize=30&apiKey=${API_KEY}`
    );

    const data = await response.json();

    if (!data.articles || data.articles.length === 0) {
      showError('No deals found. Try again later.');
      return;
    }

    // Process articles
    const deals = data.articles
      .map(article => {
        const title = article.title || '';
        const text = title.toLowerCase();

        let region = 'France & Europe';
        if (text.includes('france')) region = 'France';

        const amountMatch = title.match(/\$[\d.]+\s*(m|b|million|billion)?/i);
        const amount = amountMatch ? amountMatch[0] : 'Undisclosed';

        return {
          title: title,
          amount: amount,
          region: region,
          source: article.source.name,
          date: article.publishedAt.split('T')[0],
          url: article.url,
          description: article.description || ''
        };
      })
      .filter(d => d.title && d.title.length > 10)
      .slice(0, 15);

    if (deals.length === 0) {
      showError('No relevant deals found.');
      return;
    }

    window.dealsData = deals;
    showDealsList(deals);

  } catch (error) {
    showError('Error: ' + error.message);
  }
}

function showDealsList(deals) {
  let html = '<div class="card"><h3 style="margin-top: 0;">Found ' + deals.length + ' deals - Click one to generate note:</h3>';
  html += '<div class="deals-list">';

  deals.forEach((deal, i) => {
    html += `
      <div class="deal-item" onclick="selectDeal(${i})">
        <div class="deal-title">${deal.title.substring(0, 80)}</div>
        <div class="deal-meta">💰 ${deal.amount} | 📅 ${deal.date} | ${deal.source}</div>
      </div>
    `;
  });

  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function selectDeal(index) {
  const deal = window.dealsData[index];
  const note = generateNote(deal);
  showNote(deal, note);
}

function generateNote(deal) {
  let note = deal.title.substring(0, 50) + ' raised ' + deal.amount + '.\n\n';
  note += 'The play: ' + deal.description.substring(0, 80) + '\n\n';
  note += 'Why it matters: Fresh conviction in ' + deal.region.toLowerCase() + ' tech. Check investor mix.\n\n';
  note += 'What consensus misses: Unit economics are often higher than comparable exits.\n\n';
  note += 'Real question: Can they maintain growth at half the current CAC burn?\n\n';
  note += 'Source: ' + deal.source;

  // Word limit
  const words = note.split(/\s+/);
  if (words.length > 120) {
    note = words.slice(0, 120).join(' ') + '...';
  }

  // Remove em-dashes
  note = note.replace(/—/g, ',');

  return note;
}

function showNote(deal, note) {
  const wordCount = note.split(/\s+/).length;

  let html = `
    <div class="note-display">
      <div class="deal-header">
        <h2>${deal.title}</h2>
        <p>💰 ${deal.amount} | 📅 ${deal.date} | ${deal.source}</p>
        <span class="region-tag">${deal.region}</span>
        <p><a href="${deal.url}" target="_blank" style="color: #0066cc;">Read full article →</a></p>
      </div>

      <h3>Your Substack Note:</h3>
      <div class="note-text">${note}</div>
      <div class="word-count">Words: ${wordCount} / 120</div>

      <button class="copy" onclick="copyNote('${note.replace(/'/g, "\\'")}')">📋 Copy to Clipboard</button>
      <button class="back" onclick="loadDeals()">← Back to Deals</button>
      <div id="copy-msg"></div>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
  window.currentNote = note;
}

function copyNote(note) {
  navigator.clipboard.writeText(note).then(() => {
    document.getElementById('copy-msg').innerHTML = '<p class="success">✓ Copied! Paste in Substack</p>';
  }).catch(() => {
    alert('Copy failed. Try: select all (Ctrl+A) then Ctrl+C');
  });
}

function showError(msg) {
  let html = `
    <div class="card error">${msg}</div>
    <div class="card">
      <button onclick="loadDeals()">Try Again</button>
    </div>
  `;
  document.getElementById('app').innerHTML = html;
}

// Load on startup
loadDeals();
</script>

</body>
</html>
